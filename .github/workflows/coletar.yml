name: Coletar ofertas

on:
  schedule:
    # 06:17, 12:17 e 18:17 em São Paulo (09:17, 15:17, 21:17 UTC)
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Rodar só algumas etapas (meta, criativos, midia, google, tiktok, ra, paginas, ia, kit, transcricao, alertas), separadas por vírgula. Vazio roda tudo."
        required: false
        default: ""
      paises:
        description: "Só estes países na busca da Meta (ex.: BR,US). Vazio = todos com palavra-chave ativa."
        required: false
        default: ""

concurrency:
  group: coletar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes do leitor
        run: npm test

      - name: Coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          ONLY: ${{ github.event.inputs.only }}
          META_COUNTRIES: ${{ github.event.inputs.paises }}
        run: |
          if [ -n "$ONLY" ]; then
            npm run collect -- "--only=$ONLY"
          else
            npm run collect
          fi

      # se o job quebrar antes do robô rodar (instalação, testes, tempo esgotado), avisa também
      - name: Avisar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>Radar: o job da coleta falhou</b> (instalação, testes ou tempo esgotado). <a href=\"${RUN_URL}\">ver execução</a>" > /dev/null
