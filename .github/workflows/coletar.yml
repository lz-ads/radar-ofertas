name: Coletar ofertas

on:
  schedule:
    # 06:17, 12:17 e 18:17 em São Paulo (09:17, 15:17, 21:17 UTC)
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Rodar só uma fonte (meta, google, ra) — vazio roda tudo"
        required: false
        default: ""

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes do leitor
        run: npm test

      - name: Coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            npm run collect -- --only=${{ github.event.inputs.only }}
          else
            npm run collect
          fi
